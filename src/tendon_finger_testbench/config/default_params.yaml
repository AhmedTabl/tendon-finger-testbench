# Default ROS 2 parameters for the tendon finger actuator testbench.
#
# Parameters that are generally safe to tune live:
#   controller gains, torque/current limits, encoder/output noise, backlash,
#   tendon stiffness/damping, external load, command/measurement delay, and
#   test amplitudes/frequencies.
#
# Parameters that should be treated as restart-required in this first pass:
#   update rates, MuJoCo XML path/viewer settings, and major model topology.

plant_sim_node:
  ros__parameters:
    update_rate_hz: 500.0

    mujoco:
      enable: true
      launch_viewer: true
      xml_path: ""

    motor:
      inertia_kg_m2: 0.00012
      viscous_damping_nm_s_per_rad: 0.0002
      coulomb_friction_nm: 0.0003
      static_friction_nm: 0.0005
      stiffness_nm_per_rad: 0.0
      torque_constant_nm_per_a: 0.11

    finger:
      inertia_kg_m2: 0.00018
      length_m: 0.09
      mass_kg: 0.055
      com_length_m: 0.045
      viscous_damping_nm_s_per_rad: 0.0015
      coulomb_friction_nm: 0.0008
      static_friction_nm: 0.0012
      joint_stiffness_nm_per_rad: 0.02
      enable_gravity: true

    friction:
      stiction_velocity_rad_s: 0.025

    transmission:
      gear_ratio: 5.0
      spool_radius_m: 0.012
      spool_inertia_kg_m2: 0.00035
      spool_viscous_damping_nm_s_per_rad: 0.0002
      spool_coulomb_friction_nm: 0.0002
      tendon_moment_arm_m: 0.018

    tendon:
      stiffness_n_per_m: 850.0
      damping_n_s_per_m: 1.5
      slack_m: 0.001

    backlash:
      motor_deadband_rad: 0.025
      output_deadband_mm: 0.5

    sensors:
      encoder_counts_per_rev: 4096.0
      encoder_noise_std_rad: 0.0008
      encoder_velocity_noise_std_rad_s: 0.004
      output_sensor_enabled: true
      output_sensor_noise_std_rad: 0.0012
      output_sensor_velocity_noise_std_rad_s: 0.006
      random_seed: 7

    delay:
      command_delay_s: 0.005
      measurement_delay_s: 0.004

    load:
      external_torque: 0.0

    actuator:
      torque_lag_time_constant_s: 0.008

    thermal:
      ambient_temperature_c: 25.0
      heating_coeff_c_per_a2_s: 0.09
      cooling_coeff_per_s: 0.025

    safety:
      min_position_rad: -0.05
      max_position_rad: 1.35
      min_motor_position_rad: 0.0
      max_velocity_rad_s: 18.0
      max_current_a: 2.5
      min_torque_nm: 0.0
      max_torque_nm: 0.35
      max_temperature_c: 85.0

controller_node:
  ros__parameters:
    update_rate_hz: 250.0
    feedback_source: "output_sensor"
    target_position_rad: 0.0
    target_velocity_rad_s: 0.0

    position:
      kp: 4.0
      ki: 0.0
      kd: 0.0
      integral_limit: 1.0
      velocity_limit_rad_s: 1.5

    velocity:
      kp: 0.006
      ki: 0.0
      kd: 0.0
      integral_limit: 4.0
      minimum_torque_nm: 0.0
      torque_limit_nm: 0.275

    feedforward:
      velocity_gain_nm_per_rad_s: 0.0
      acceleration_gain_nm_per_rad_s2: 0.0
      gravity_compensation: true
      joint_stiffness_compensation: true
      friction_compensation: false

    model:
      finger_mass_kg: 0.055
      finger_com_length_m: 0.045
      finger_coulomb_friction_nm: 0.012
      finger_joint_stiffness_nm_per_rad: 0.02

    transmission:
      gear_ratio: 5.0
      spool_radius_m: 0.012
      tendon_moment_arm_m: 0.018

    motor:
      torque_constant_nm_per_a: 0.11

    safety:
      max_current_a: 2.5
      max_torque_nm: 0.35

data_logger_node:
  ros__parameters:
    output_directory: "data"
    file_prefix: "testbench"
    flush_every_n_rows: 25

test_executor_node:
  ros__parameters:
    mode: "step"
    auto_start: false
    output_directory: "data"
    duration_s: 8.0
    start_delay_s: 1.0
    publish_rate_hz: 50.0

    step:
      target_rad: 0.75
      hold_s: 5.0

    backlash:
      amplitude_rad: 0.65
      cycles: 4.0
      period_s: 3.0

    friction:
      amplitude_rad: 0.9
      period_s: 12.0

    sine:
      amplitude_rad: 0.45
      bias_rad: 0.55
      frequency_hz: 0.5

    chirp:
      amplitude_rad: 0.45
      bias_rad: 0.55
      start_frequency_hz: 0.1
      end_frequency_hz: 3.0

    load:
      target_rad: 0.8
      external_torque_nm: 0.08

    thermal:
      amplitude_rad: 0.55
      bias_rad: 0.55
      frequency_hz: 0.8

    transmission:
      gear_ratio: 5.0
      spool_radius_m: 0.012
      tendon_moment_arm_m: 0.018

    finger:
      length_m: 0.09

command_cli_node:
  ros__parameters:
    transmission:
      gear_ratio: 5.0
      spool_radius_m: 0.012
      tendon_moment_arm_m: 0.018
    finger:
      length_m: 0.09
